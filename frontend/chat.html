<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — 채팅</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">

  <!-- 헤더 -->
  <header class="bg-white shadow-sm px-4 py-3 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-4">
      <span class="text-teal-600 font-bold text-lg">TaskFlow</span>
      <span id="team-name-display" class="text-sm text-gray-500"></span>
    </div>
    <nav class="flex items-center gap-2">
      <a href="kanban.html" class="px-3 py-1 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100">칸반</a>
      <a href="chat.html" class="px-3 py-1 rounded-md text-sm font-medium bg-teal-600 text-white">채팅</a>
      <button onclick="logout()" class="px-3 py-1 rounded-md text-sm font-medium text-gray-400 hover:text-gray-600">로그아웃</button>
    </nav>
  </header>

  <!-- 연결 상태 배너 -->
  <div id="conn-banner" class="hidden bg-red-50 border-b border-red-200 px-4 py-2 text-sm text-red-600 text-center flex-shrink-0">
    ⚠ 연결 끊김 · 재시도 중…
  </div>

  <!-- 메시지 영역 -->
  <div id="messages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3"></div>

  <!-- 입력창 -->
  <div class="bg-white border-t px-4 py-3 flex-shrink-0">
    <div class="flex gap-2 items-end">
      <div class="flex-1">
        <textarea id="msg-input" rows="2" placeholder="메시지 입력 (1000자 이내)…"
          class="w-full px-3 py-2 border rounded-lg text-sm resize-none focus:outline-none focus:ring-2 focus:ring-teal-400"
          oninput="onInputChange()" onkeydown="onKeyDown(event)"></textarea>
        <div class="flex justify-between mt-1">
          <span id="char-count" class="text-xs text-gray-400">0 / 1000</span>
          <span id="char-warning" class="hidden text-xs text-red-500">1000자 초과</span>
        </div>
      </div>
      <button id="send-btn" onclick="sendMessage()"
        class="px-4 py-2 bg-teal-600 text-white rounded-lg text-sm font-medium hover:bg-teal-700 transition self-start">
        전송
      </button>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (!requireTeam()) {}

    const teamId = getTeamId();
    let currentUserId = null, lastCreatedAt = null;
    let pollTimer = null, retryDelay = 5000, retryCount = 0;

    async function init() {
      const me = await apiFetch('/auth/me');
      currentUserId = me.id;
      const team = await apiFetch(`/teams/${teamId}`);
      document.getElementById('team-name-display').textContent = team.name + ' 팀';
      await loadMessages(false);
      startPolling();
    }

    async function loadMessages(incremental = true) {
      const url = incremental && lastCreatedAt
        ? `/teams/${teamId}/messages?since=${encodeURIComponent(lastCreatedAt)}`
        : `/teams/${teamId}/messages`;
      const msgs = await apiFetch(url);
      if (msgs && msgs.length > 0) {
        if (!incremental) renderAll(msgs);
        else appendMessages(msgs);
        lastCreatedAt = msgs[msgs.length - 1].created_at;
      } else if (!incremental) {
        renderEmpty();
      }
    }

    function renderAll(msgs) {
      const el = document.getElementById('messages');
      el.innerHTML = msgs.map(msgHtml).join('');
      scrollBottom();
    }

    function renderEmpty() {
      document.getElementById('messages').innerHTML =
        '<div class="flex flex-col items-center justify-center py-16 text-gray-400">' +
        '<span class="text-4xl mb-2">💬</span>' +
        '<p class="text-sm">아직 대화가 없습니다</p>' +
        '<p class="text-xs mt-1">첫 메시지를 보내 팀원과 대화를 시작하세요</p></div>';
    }

    function appendMessages(msgs) {
      const el = document.getElementById('messages');
      const wasEmpty = el.querySelector('.text-gray-400');
      if (wasEmpty) el.innerHTML = '';
      msgs.forEach(m => el.insertAdjacentHTML('beforeend', msgHtml(m)));
      scrollBottom();
    }

    function msgHtml(m) {
      const isMe = m.user_id === currentUserId;
      const time = new Date(m.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      const name = m.user_email ? m.user_email.split('@')[0] : '알 수 없음';
      const deleteBtn = isMe
        ? `<button onclick="deleteMessage(${m.id}, this)" class="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-400 ml-2 text-xs transition">🗑</button>`
        : '';
      if (isMe) {
        return `<div class="flex justify-end group">
          <div class="max-w-xs">
            <p class="text-xs text-gray-400 text-right mb-1">나 · ${time}</p>
            <div class="flex items-center justify-end">
              ${deleteBtn}
              <div class="bg-teal-600 text-white rounded-2xl rounded-tr-none px-4 py-2 text-sm break-words">${escHtml(m.content)}</div>
            </div>
          </div>
        </div>`;
      }
      return `<div class="flex justify-start group">
        <div class="max-w-xs">
          <p class="text-xs text-gray-400 mb-1">${escHtml(name)} · ${time}</p>
          <div class="bg-white border rounded-2xl rounded-tl-none px-4 py-2 text-sm break-words shadow-sm">${escHtml(m.content)}</div>
        </div>
      </div>`;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function scrollBottom() {
      const el = document.getElementById('messages');
      el.scrollTop = el.scrollHeight;
    }

    // 폴링
    function startPolling() {
      if (pollTimer) clearTimeout(pollTimer);
      pollTimer = setTimeout(poll, retryDelay);
    }

    async function poll() {
      try {
        await loadMessages(true);
        document.getElementById('conn-banner').classList.add('hidden');
        retryDelay = 5000; retryCount = 0;
      } catch (e) {
        retryCount++;
        retryDelay = Math.min(retryDelay * 2, 60000);
        document.getElementById('conn-banner').classList.remove('hidden');
      }
      startPolling();
    }

    // 메시지 전송
    function onInputChange() {
      const len = document.getElementById('msg-input').value.length;
      document.getElementById('char-count').textContent = len + ' / 1000';
      const over = len > 1000;
      document.getElementById('char-count').className = 'text-xs ' + (over ? 'text-red-500' : 'text-gray-400');
      document.getElementById('char-warning').classList.toggle('hidden', !over);
      document.getElementById('send-btn').disabled = over;
    }

    function onKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const content = input.value.trim();
      if (!content || content.length > 1000) return;
      input.value = ''; onInputChange();
      try {
        const msg = await apiFetch(`/teams/${teamId}/messages`, {
          method: 'POST', body: JSON.stringify({ content })
        });
        appendMessages([msg]);
        lastCreatedAt = msg.created_at;
      } catch (e) {
        alert(e.message);
      }
    }

    async function deleteMessage(id, btn) {
      try {
        await apiFetch(`/messages/${id}`, { method: 'DELETE' });
        btn.closest('.flex').remove();
      } catch (e) { alert(e.message); }
    }

    function logout() { clearSession(); window.location.href = 'login.html'; }

    init();
  </script>
</body>
</html>
